services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://clipforge:clipforge_dev_password@postgres:5432/clipforge
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge_dev_password
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  ollama_data: